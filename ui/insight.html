<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/i18n.js"></script>
<title>Insight · lance-indexer</title>
<style>
  :root {
    --bg: #0c0d10; --panel: #131519; --panel2: #181b21; --line: #23272f; --line2: #2e333d;
    --fg: #e4e7ec; --dim: #8b93a1; --dim2: #5d6572;
    --acc: #7dd3a0; --accdim: #2f5c45; --acc2: #5ba8f5; --hit: #f0c674;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; scrollbar-color: var(--line2) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 9px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 5px; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.6 var(--mono); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel);
           position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 600; color: var(--acc); white-space: nowrap; }
  .brand span { color: var(--dim2); font-weight: 400; }
  nav.pages { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
  nav.pages a { color: var(--dim); font: 11px var(--mono); padding: 8px 12px; text-decoration: none; }
  nav.pages a + a { border-left: 1px solid var(--line2); }
  nav.pages a:hover { color: var(--fg); }
  nav.pages a[aria-current="page"] { background: var(--accdim); color: #dff5e8; }
  main { max-width: 880px; margin: 0 auto; padding: 26px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 18px; }
  .ask { display: flex; gap: 8px; }
  textarea { flex: 1; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px;
             color: var(--fg); font: 14px var(--mono); padding: 11px 13px; resize: vertical;
             min-height: 58px; outline: none; }
  textarea:focus { border-color: var(--accdim); }
  button.go { background: var(--accdim); border: 1px solid var(--acc); border-radius: 8px;
              color: #dff5e8; font: 13px var(--mono); padding: 0 22px; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: wait; }
  .opts { display: flex; gap: 10px; margin-top: 8px; color: var(--dim); font-size: 12px;
          align-items: center; flex-wrap: wrap; }
  .opts select, .opts input { background: var(--panel); border: 1px solid var(--line2);
    border-radius: 6px; color: var(--fg); font: 12px var(--mono); padding: 5px 8px; }
  #status { color: var(--dim2); font-size: 12px; min-height: 20px; margin: 14px 0 6px; }
  #answer { background: var(--panel); border: 1px solid var(--accdim); border-radius: 10px;
            padding: 16px 20px; white-space: pre-wrap; word-break: break-word; }
  #answer:empty { display: none; }
  #answer .cite { color: var(--acc2); cursor: pointer; font-weight: 700; }
  h2 { font-size: 11px; color: var(--dim2); letter-spacing: .12em; text-transform: uppercase;
       margin: 22px 0 8px; }
  .ev { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: 9px 13px; margin-bottom: 8px; }
  .ev.hl { border-color: var(--hit); }
  .ev .h { display: flex; gap: 10px; color: var(--dim); font-size: 11.5px; flex-wrap: wrap; }
  .ev .h b { color: var(--acc); font-weight: 600; }
  .ev .t { color: #c9d0da; font-size: 12.5px; margin-top: 3px; }
  .hint { color: var(--dim2); font-size: 12px; }
  .hint span { color: var(--dim); cursor: pointer; text-decoration: underline dotted; }
</style>
</head>
<body>
<header>
  <span class="brand">⛏ lance<span>·indexer</span></span>
  <nav class="pages">
    <a href="/" data-i18n="nav.search"></a>
    <a href="/map" data-i18n="nav.map"></a>
    <a href="/insight" aria-current="page" data-i18n="nav.insight"></a>
    <a href="/live" data-i18n="nav.live"></a>
    <a href="/admin" data-i18n="nav.jobs"></a>
  </nav>
  <button class="ghost" data-lang-switch style="margin-left:auto;background:transparent;border:1px solid var(--line2);border-radius:6px;color:var(--dim);font:11px var(--mono);padding:7px 12px;cursor:pointer"></button>
</header>
<main>
  <h1 data-i18n="insight.h1"></h1>
  <p class="sub"><span data-i18n="insight.sub1"></span> <span id="veccount">…</span> <span data-i18n="insight.sub2"></span></p>
  <div class="ask">
    <textarea id="q" data-i18n-placeholder="insight.placeholder"></textarea>
    <button class="go" id="go" data-i18n="insight.ask"></button>
  </div>
  <div class="opts">
    <label>model <select id="model">
      <option value="qwen2.5:7b" data-i18n="insight.model.fast"></option>
      <option value="qwen3:30b-a3b" data-i18n="insight.model.smart"></option>
      <option value="gemma4:12b">gemma4:12b</option>
    </select></label>
    <label>k <input id="k" type="number" value="12" min="4" max="24" style="width:52px"></label>
    <label>repo <input id="repo" data-i18n-placeholder="insight.repoPlaceholder" style="width:150px"></label>
  </div>
  <p class="hint"><span data-i18n="insight.tryLabel" style="cursor:default;text-decoration:none"></span>
    <span data-i18n="insight.try1"></span> ·
    <span data-i18n="insight.try2"></span> ·
    <span data-i18n="insight.try3"></span></p>
  <div id="status"></div>
  <div id="answer"></div>
  <div id="evwrap" hidden>
    <h2 data-i18n="insight.evidence"></h2>
    <div id="evidence"></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
fetch('/api/facets').then((r) => r.json()).then((f) => { $('#veccount').textContent = f.corpus.vectors.toLocaleString(); });
i18n.apply();
document.querySelectorAll('.hint span[data-i18n^="insight.try"]').forEach((el) =>
  el.onclick = () => { $('#q').value = el.textContent; ask(); });

async function ask() {
  const q = $('#q').value.trim();
  if (!q) return;
  $('#go').disabled = true;
  $('#answer').textContent = '';
  $('#evwrap').hidden = true;
  const t0 = Date.now();
  $('#status').textContent = t('insight.searching');
  const tick = setInterval(() => {
    $('#status').textContent = t('insight.thinking', { s: ((Date.now() - t0) / 1000).toFixed(0) });
  }, 1000);
  try {
    const d = await (await fetch('/api/insight', {
      method: 'POST',
      body: JSON.stringify({ q, k: Number($('#k').value), repo: $('#repo').value.trim(), model: $('#model').value }),
    })).json();
    clearInterval(tick);
    if (d.error) { $('#status').textContent = '✗ ' + tsrv(d); return; }
    $('#status').textContent = `${d.model} · embed ${d.took.embed}ms · search ${d.took.search}ms · llm ${(d.took.llm/1000).toFixed(1)}s`;
    // อ้าง [n] คลิกได้ → ไฮไลต์หลักฐาน
    $('#answer').innerHTML = esc(d.answer).replace(/\[(\d+)\]/g, '<span class="cite" data-n="$1">[$1]</span>');
    $('#evidence').innerHTML = d.evidence.map((e) => `
      <div class="ev" id="ev-${e.n}">
        <div class="h"><b>[${e.n}]</b><span>📦 ${esc(e.repo)}</span><span>${esc(e.role)}</span>
          <span>${esc(e.ts ? new Date(e.ts).toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok' }).slice(0, 16) : '')}</span>
          <span>d=${(e.d ?? 0).toFixed(3)}</span>
          <span>${esc(e.session.slice(0, 22))}#${e.line}</span></div>
        <div class="t">${esc(e.snippet)}…</div>
      </div>`).join('');
    $('#evwrap').hidden = false;
    document.querySelectorAll('.cite').forEach((c) => c.onclick = () => {
      const ev = $(`#ev-${c.dataset.n}`);
      if (!ev) return;
      document.querySelectorAll('.ev').forEach((x) => x.classList.remove('hl'));
      ev.classList.add('hl');
      ev.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  } catch (e) { clearInterval(tick); $('#status').textContent = '✗ ' + t('common.loadFailed', { error: e }); }
  finally { $('#go').disabled = false; }
}
$('#go').onclick = ask;
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask(); });
</script>
<script src="/demo.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/i18n.js"></script>
<title>Lance Indexer</title>
<style>
  :root {
    --bg: #0c0d10; --panel: #131519; --panel2: #181b21; --line: #23272f; --line2: #2e333d;
    --fg: #e4e7ec; --dim: #8b93a1; --dim2: #5d6572;
    --acc: #7dd3a0; --accdim: #2f5c45; --hit: #f0c674;
    --user: #7aa2f7; --assistant: #e8b04b; --tool: #bb9af7; --result: #7d8590; --think: #6b7f8f;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root { color-scheme: dark; }  /* scrollbar/native widget เป็น dark — กัน track ขาวโพลน */
  * { box-sizing: border-box; scrollbar-color: var(--line2) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim2); }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--mono);
         display: grid; grid-template-rows: auto 1fr; overflow: hidden; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font-weight: 600; color: var(--acc); white-space: nowrap; }
  .brand span { color: var(--dim2); font-weight: 400; }
  #q { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line2);
       border-radius: 6px; color: var(--fg); font: 13px var(--mono); padding: 7px 11px; outline: none; }
  #q:focus { border-color: var(--accdim); }
  .modes { display: flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
  .modes button { background: transparent; border: 0; color: var(--dim); font: 11px var(--mono);
                  padding: 8px 11px; cursor: pointer; }
  .modes button + button { border-left: 1px solid var(--line2); }
  .modes button[aria-pressed="true"] { background: var(--accdim); color: #dff5e8; }
  .took { font: 11px var(--mono); color: var(--dim2); white-space: nowrap; }
  .ghost { background: transparent; border: 1px solid var(--line2); border-radius: 6px;
           color: var(--dim); font: 11px var(--mono); padding: 8px 11px; cursor: pointer;
           text-decoration: none; }
  .ghost:hover { color: var(--fg); border-color: var(--accdim); }
  nav.pages { display: flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
  nav.pages a { color: var(--dim); font: 11px var(--mono); padding: 8px 12px;
                text-decoration: none; white-space: nowrap; }
  nav.pages a + a { border-left: 1px solid var(--line2); }
  nav.pages a:hover { color: var(--fg); }
  nav.pages a[aria-current="page"] { background: var(--accdim); color: #dff5e8; }

  .body { display: grid; grid-template-columns: 215px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 0 24px; }
  aside h3 { font-size: 10px; color: var(--dim2); letter-spacing: .12em; margin: 14px 14px 3px;
             font-weight: 400; }
  aside .f { display: flex; justify-content: space-between; gap: 8px; padding: 2px 14px;
             cursor: pointer; color: var(--dim); font-size: 12px; }
  aside .f:hover { color: var(--fg); }
  aside .f[aria-pressed="true"] { color: var(--acc); background: #7dd3a012; }
  aside .f .n { color: var(--dim2); font-variant-numeric: tabular-nums; }
  aside .f .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .stat { display: flex; justify-content: space-between; padding: 1.5px 14px;
                color: var(--dim); font-size: 12px; }
  aside .stat .n { color: var(--fg); font-variant-numeric: tabular-nums; }
  .jobbtns { display: flex; gap: 6px; padding: 4px 14px 2px; }
  .jobbtns button { flex: 1; background: var(--panel2); border: 1px solid var(--line2);
    border-radius: 5px; color: var(--dim); font: 11px var(--mono); padding: 5px 0; cursor: pointer; }
  .jobbtns button:hover { color: var(--acc); border-color: var(--accdim); }
  .jobbtns button:disabled { color: var(--dim2); cursor: wait; }
  #tty { margin: 6px 10px 0; background: #08090c; border: 1px solid var(--line);
         border-radius: 6px; padding: 6px 8px; font-size: 10.5px; line-height: 1.45;
         color: #9fb8a8; max-height: 150px; overflow-y: auto; white-space: pre-wrap;
         word-break: break-all; cursor: zoom-in; }
  #tty:empty { display: none; }
  #tty:hover { border-color: var(--accdim); }
  #ttymodal { position: fixed; inset: 0; background: #000a; z-index: 20;
              display: flex; align-items: center; justify-content: center; }
  #ttymodal[hidden] { display: none; }  /* display:flex บน id ชนะ UA [hidden] — ต้องกดกลับเอง */
  #ttymodal .term { width: min(900px, 92vw); height: min(70vh, 640px); background: #08090c;
                    border: 1px solid var(--line2); border-radius: 10px; display: flex;
                    flex-direction: column; box-shadow: 0 18px 60px #000c; }
  #ttymodal .thead { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
                     border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  #ttymodal .thead .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim2); }
  #ttymodal .thead .dot.live { background: var(--acc); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #ttymodal pre { flex: 1; margin: 0; padding: 12px 14px; overflow-y: auto;
                  font: 12.5px/1.55 var(--mono); color: #9fb8a8; white-space: pre-wrap;
                  word-break: break-all; }

  #results { overflow-y: auto; min-height: 0; }
  .row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 8px 16px;
         border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--panel); }
  .row .kind .t { font-weight: 600; font-size: 11.5px; }
  .t.text.user { color: var(--user); } .t.text.assistant { color: var(--assistant); }
  .t.tool_use { color: var(--tool); } .t.tool_result { color: var(--result); }
  .t.thinking { color: var(--think); } .t.summary { color: var(--acc); } .t.image { color: var(--dim2); }
  .row .kind .when { color: var(--dim2); font-size: 10.5px; margin-top: 2px; }
  .row .h { color: var(--dim); font-size: 11px; display: flex; gap: 8px; flex-wrap: wrap; }
  .row .h .prov { color: var(--dim2); }
  .row .h .prov b { color: var(--acc); font-weight: 500; }
  .row .t2 { margin-top: 2px; white-space: pre-wrap; word-break: break-word; font-size: 12.5px;
             color: #c9d0da; max-height: 4.6em; overflow: hidden; }
  mark { background: transparent; color: var(--hit); font-weight: 700; }
  #empty { color: var(--dim2); text-align: center; padding: 60px 0; }

  #ctxbtn { position: fixed; right: 16px; top: 62px; z-index: 4;
            background: var(--panel2); border: 1px solid var(--accdim); border-radius: 6px;
            color: var(--acc); font: 12px var(--mono); padding: 7px 13px; cursor: pointer; }
  #ctxbtn[hidden] { display: none; }
  #repoctx { position: fixed; inset: 0 0 0 auto; width: min(520px, 92vw); background: var(--panel);
             border-left: 1px solid var(--accdim); box-shadow: -12px 0 30px #0009; z-index: 6;
             overflow-y: auto; padding: 14px 18px 60px; overscroll-behavior: contain; }
  #repoctx[hidden] { display: none; }
  #repoctx h2 { font-size: 15px; margin: 0 0 2px; color: var(--acc); }
  #repoctx h3 { font-size: 10px; color: var(--dim2); letter-spacing: .12em; margin: 16px 0 6px;
                text-transform: uppercase; }
  #repoctx .m { color: var(--dim); font-size: 12px; }
  #repoctx .bar { display: flex; align-items: flex-end; gap: 2px; height: 46px; margin-top: 4px; }
  #repoctx .bar i { background: var(--accdim); flex: 1; min-width: 2px; }
  #repoctx .row { display: flex; justify-content: space-between; gap: 8px; padding: 1.5px 0;
                  font-size: 12px; color: var(--dim); }
  #repoctx .row .n { color: var(--fg); font-variant-numeric: tabular-nums; }
  #repoctx .dist { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 0; }
  #repoctx .dist .track { flex: 1; height: 4px; background: var(--panel2); border-radius: 2px; }
  #repoctx .dist .track i { display: block; height: 100%; background: var(--acc2); border-radius: 2px; }
  #repoctx .sum { border-left: 2px solid var(--line2); padding: 2px 8px; margin: 6px 0;
                  font-size: 12px; color: #c9d0da; }
  #repoctx .sum .m { font-size: 10.5px; }
  #repoctx a.mapbtn { display: inline-block; margin-top: 8px; background: var(--accdim);
                      border-radius: 6px; color: #dff5e8; font-size: 12px; padding: 7px 14px;
                      text-decoration: none; }
  #mapmodal { position: fixed; inset: 0; background: #000b; z-index: 30;
              display: grid; place-items: center; }
  #mapmodal[hidden] { display: none; }
  #mapmodal .frame { width: min(1200px, 96vw); height: min(82vh, 900px); position: relative;
                     border: 1px solid var(--accdim); border-radius: 12px; overflow: hidden;
                     box-shadow: 0 22px 70px #000d; background: #0a0c10; }
  #mapmodal iframe { width: 100%; height: 100%; border: 0; display: block; }
  #mapmodal .close { position: absolute; top: 10px; right: 12px; z-index: 2;
                     background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px;
                     color: var(--fg); font: 13px var(--mono); padding: 6px 12px; cursor: pointer; }
  #mapmodal .open { position: absolute; top: 10px; right: 64px; z-index: 2;
                    background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px;
                    color: var(--dim); font: 12px var(--mono); padding: 6px 12px; cursor: pointer;
                    text-decoration: none; }
  #drill { position: fixed; inset: 0 0 0 auto; width: min(680px, 94vw); background: var(--panel);
           border-left: 1px solid var(--line); display: flex; flex-direction: column;
           box-shadow: -12px 0 30px #0009; z-index: 5; }
  #drill[hidden] { display: none; }  /* display:flex บน id ชนะ UA [hidden] */
  #drill .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; }
  #drill .top .meta { color: var(--dim); font-size: 11px; min-width: 0; overflow: hidden;
                      text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #drill .tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  #drill .tabs button { background: none; border: 0; border-bottom: 2px solid transparent;
                        color: var(--dim); font: 12px var(--mono); padding: 6px 10px; cursor: pointer; }
  #drill .tabs button[aria-pressed="true"] { color: var(--acc); border-bottom-color: var(--acc); }
  #drill .bd { overflow-y: auto; padding: 12px 16px; white-space: pre-wrap; word-break: break-word;
               font-size: 12.5px; flex: 1; }
  #drill .ev { border-left: 3px solid var(--line); padding: 3px 10px; margin: 8px 0; cursor: pointer; }
  #drill .ev.cur { background: #7dd3a012; border-color: var(--acc); }
  #drill .ev .h { font-size: 11px; color: var(--dim); white-space: nowrap; }
  #drill .ev .t { white-space: pre-wrap; word-break: break-word; font-size: 12px;
                  max-height: 3.1em; overflow: hidden; color: #c9d0da; }
</style>
</head>
<body>
<header>
  <span class="brand">⛏ lance<span>·indexer</span></span>
  <input id="q" type="text" data-i18n-placeholder="search.placeholder" autofocus>
  <div class="modes">
    <button data-m="text" aria-pressed="true">fts</button>
    <button data-m="vector" aria-pressed="false">vector</button>
    <button data-m="hybrid" aria-pressed="false">hybrid</button>
  </div>
  <span class="took" id="took">—</span>
  <nav class="pages">
    <a href="/" aria-current="page" data-i18n="nav.search"></a>
    <a href="/map" data-i18n="nav.map"></a>
    <a href="/insight" data-i18n="nav.insight"></a>
    <a href="/live" data-i18n="nav.live"></a>
    <a href="/admin" data-i18n="nav.jobs"></a>
  </nav>
  <button class="ghost" onclick="refreshIndex()">↻</button>
  <button class="ghost" data-lang-switch></button>
</header>
<div class="body">
  <aside id="facets"></aside>
  <div id="results"></div>
</div>
<button id="ctxbtn" hidden onclick="toggleRepoCtx()">🧭 context</button>
<div id="mapmodal" hidden>
  <div class="frame">
    <a class="open" id="mapmodalOpen" href="#" target="_blank" data-i18n="search.openFull"></a>
    <button class="close" onclick="closeMapModal()">✕</button>
    <iframe id="mapframe" src="about:blank"></iframe>
  </div>
</div>
<div id="repoctx" hidden></div>
<div id="ttymodal" hidden>
  <div class="term">
    <div class="thead">
      <span class="dot" id="ttydot"></span>
      <span id="ttytitle">job log</span>
      <span style="flex:1"></span>
      <button id="ttystart" hidden
        style="background:var(--accdim);border:1px solid var(--acc);border-radius:6px;color:#dff5e8;font:12px var(--mono);padding:7px 16px;cursor:pointer" data-i18n="job.start"></button>
      <button id="ttykill" hidden onclick="killJob()"
        style="background:#3a1f1f;border:1px solid #f0928f;border-radius:6px;color:#f0c0be;font:12px var(--mono);padding:7px 16px;cursor:pointer" data-i18n="job.stop"></button>
      <button class="ghost" id="ttyclose" onclick="closeTtyModal()">✕</button>
    </div>
    <pre id="ttybig"></pre>
  </div>
</div>
<div id="drill" hidden>
  <div class="top">
    <div class="meta" id="d-meta"></div>
    <button class="ghost" onclick="closeDrill()">✕</button>
  </div>
  <div class="tabs">
    <button data-t="text" aria-pressed="true">text</button>
    <button data-t="timeline" aria-pressed="false">timeline</button>
    <button data-t="raw" aria-pressed="false">raw</button>
  </div>
  <div class="bd" id="d-body"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTs = (t) => t ? new Date(t).toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';  // GMT+7 เสมอ
let mode = 'text';
const GROUPS = ['kind', 'role', 'tier', 'repo', 'tool', 'model'];
const filter = Object.fromEntries(GROUPS.map((g) => [g, '']));
let cur = null; // block ที่เปิดใน drill: {id, file, line}
let curTab = 'text';

document.querySelectorAll('.modes button').forEach((b) => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll('.modes button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  search();
});

function facetRows(group, entries) {
  return entries.map(([k, n]) => `<div class="f" aria-pressed="${filter[group] === k}"
    data-g="${group}" data-k="${esc(k)}">
    <span class="k">${esc(k)}</span><span class="n">${n.toLocaleString()}</span></div>`).join('');
}

async function loadFacets() {
  const F = await (await fetch('/api/facets')).json();
  const a = $('#facets');
  a.innerHTML = `
    <h3>CORPUS</h3>
    <div class="stat"><span>rows</span><span class="n">${F.corpus.rows.toLocaleString()}</span></div>
    <div class="stat"><span>sessions</span><span class="n">${F.corpus.sessions.toLocaleString()}</span></div>
    <div class="stat"><span>span</span><span class="n">${F.corpus.span_days}d</span></div>
    <div class="stat"><span>vectors</span><span class="n" id="veccount">${F.corpus.vectors.toLocaleString()}</span></div>
    <h3>JOBS</h3>
    <div class="jobbtns">
      <button id="jImport" onclick="startJob('import')">⟳ import</button>
      <button id="jEmbed" onclick="startJob('embed')">⚡ embed 2000</button>
    </div>
    <div id="tty"></div>
    <h3>BLOCK</h3>${facetRows('kind', F.kinds)}
    <h3>ROLE</h3>${facetRows('role', F.roles)}
    <h3>TIER</h3>${facetRows('tier', F.tiers)}
    <h3>REPO</h3>${facetRows('repo', F.repos)}
    <h3>TOOL</h3>${facetRows('tool', F.tools)}
    <h3>MODEL</h3>${facetRows('model', F.models)}`;
  a.querySelectorAll('.f').forEach((el) => el.onclick = () => {
    const g = el.dataset.g, k = el.dataset.k;
    filter[g] = filter[g] === k ? '' : k;   // กดซ้ำ = ล้าง
    loadFacets(); search();
    updateRepoCtx();
  });
  renderTty(); // sidebar เพิ่ง re-render — เอา log กับสถานะปุ่มกลับมา
}

// ── repo context: เลือก repo ใน facet → ปุ่ม 🧭 โผล่ → panel สถิติ/topics/memory distance/แผนที่ ──
function updateRepoCtx() {
  const b = $('#ctxbtn');
  if (filter.repo) { b.hidden = false; b.textContent = `🧭 ${filter.repo}`; }
  else { b.hidden = true; $('#repoctx').hidden = true; }
}
async function toggleRepoCtx() {
  const box = $('#repoctx');
  if (!box.hidden) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<p class="m">${esc(t('common.loading'))}</p>`;
  const d = await (await fetch(`/api/repo?name=${encodeURIComponent(filter.repo)}`)).json();
  if (d.error) { box.innerHTML = `<p class="m">${esc(d.error)}</p>`; return; }
  const maxDay = Math.max(...d.days.map(([, n]) => n), 1);
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div><h2>📦 ${esc(d.name)}</h2>
        <span class="m">${d.blocks.toLocaleString()} blocks · ${d.sessions} sessions · ${esc(d.first)} → ${esc(d.last)}</span></div>
      <button class="ghost" onclick="this.closest('#repoctx').hidden=true">✕</button>
    </div>
    <h3>${esc(t('repo.dailyActivity'))}</h3>
    <div class="bar">${d.days.map(([day, n]) =>
      `<i title="${day}: ${n}" style="height:${Math.max(4, n / maxDay * 100)}%"></i>`).join('')}</div>
    <h3>Blocks</h3>
    ${Object.entries(d.kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
      `<div class="row"><span>${esc(k)}</span><span class="n">${n.toLocaleString()}</span></div>`).join('')}
    <h3>${esc(t('repo.topTools'))}</h3>
    ${d.tools.map(([k, n]) =>
      `<div class="row"><span>${esc(k)}</span><span class="n">${n.toLocaleString()}</span></div>`).join('')}
    <h3>${esc(t('repo.topics'))}</h3>
    ${d.summaries.length ? d.summaries.map((s) =>
      `<div class="sum">${esc(s.text)}<div class="m">${esc(s.ts ? new Date(s.ts).toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok' }).slice(0, 16) : '')}</div></div>`).join('')
      : `<p class="m">${esc(t('repo.noSummary'))}</p>`}
    <h3>${esc(t('repo.memoryDistance'))}</h3>
    ${d.neighbors ? d.neighbors.slice(0, 10).map((nb) =>
      `<div class="dist"><span style="width:12rem;overflow:hidden;text-overflow:ellipsis">${esc(nb.repo)}</span>
        <span class="track"><i style="width:${Math.round((1 - nb.d) * 100)}%"></i></span>
        <span class="n" style="color:var(--fg)">${nb.d.toFixed(3)}</span></div>`).join('')
      : `<p class="m">${esc(t('repo.needVectors'))}</p>`}
    <a class="mapbtn" href="/map?repo=${encodeURIComponent(d.name)}"
       onclick="return openMapModal('${esc(d.name)}')">${esc(t('repo.mapThisRepo'))}</a>`;
}

// ── jobs: กดปุ่ม → popup เช็คก่อน (ทำแล้วเท่าไหร่ / ใหม่เท่าไหร่) → กด ▶ เริ่ม ถึงลงมือ ──
const jobState = { watching: null, name: null, from: 0, buf: [] };
async function startJob(name) {
  jobState.name = name;
  $('#ttymodal').hidden = false;
  $('#ttystart').hidden = true;
  $('#ttykill').hidden = true;
  $('#ttydot').className = 'dot';
  $('#ttytitle').textContent = t('job.preflightTitle', { name });
  $('#ttybig').textContent = t('job.checking');
  try {
    const p = await (await fetch(`/api/preflight?name=${name}`)).json();
    const lines = name === 'import'
      ? [t('job.import.files', { n: p.found.toLocaleString() }),
         t('job.import.unchanged', { n: p.unchanged.toLocaleString() }),
         t('job.import.new', { n: p.new.toLocaleString() }),
         t('job.import.changed', { n: p.changed.toLocaleString() }),
         ``,
         p.willImport ? t('job.import.will', { n: p.willImport.toLocaleString() }) : t('job.import.upToDate')]
      : [t('job.embed.candidates', { n: p.candidates.toLocaleString() }),
         t('job.embed.done', { n: p.embedded.toLocaleString() }),
         t('job.embed.remaining', { n: p.remaining.toLocaleString() }),
         ``,
         p.remaining ? t('job.embed.will', { n: Math.min(p.remaining, 2000).toLocaleString() }) : t('job.embed.upToDate')];
    $('#ttytitle').textContent = t('job.preflightDone', { name });
    $('#ttybig').textContent = lines.join('\n');
    $('#ttystart').hidden = false;
    $('#ttystart').onclick = () => launchJob(name);
  } catch (e) { $('#ttybig').textContent = t('job.checkFailed', { error: e }); }
}
async function launchJob(name) {
  $('#ttystart').hidden = true;
  const d = await (await fetch(`/api/${name}${name === 'embed' ? '?n=2000' : ''}`, { method: 'POST' })).json();
  if (!d.started) {
    // 409 = งานชนิดนี้วิ่งอยู่แล้ว (อาจสั่งจาก tab อื่น) — เกาะดู log ของมันแทน
    jobState.watching = name; jobState.from = 0;
    jobState.buf = [t('job.alreadyRunning', { name, note: d.note ?? t('job.runningNote') })];
  } else {
    jobState.watching = name; jobState.from = 0;
    jobState.buf = [`$ bun ${name}.ts${name === 'embed' ? ' 2000' : ''}`];
  }
  renderTty(); watchJob();
}
async function killJob() {
  if (!jobState.name) return;
  await fetch(`/api/job-kill?name=${jobState.name}`, { method: 'POST' });
}
async function watchJob() {
  if (!jobState.watching) return;
  try {
    const d = await (await fetch(`/api/job-log?name=${jobState.watching}&from=${jobState.from}`)).json();
    if (d.lines?.length) {
      jobState.buf.push(...d.lines); jobState.from = d.next;
      if (jobState.buf.length > 600) jobState.buf = jobState.buf.slice(-600);
      renderTty();
    }
    if (d.running) setTimeout(watchJob, 1000);
    else {
      jobState.buf.push(d.code === 0 ? t('job.finished') : t('job.exit', { code: d.code }));
      jobState.watching = null;
      renderTty(); loadFacets(); search();
    }
  } catch { setTimeout(watchJob, 2000); }
}
function renderTty() {
  const el = $('#tty');
  if (el) {
    el.textContent = jobState.buf.join('\n');
    el.title = t('job.expandHint');
    el.onclick = openTtyModal;
    el.scrollTop = el.scrollHeight;
  }
  const running = !!jobState.watching;
  const bi = $('#jImport'), be = $('#jEmbed');
  if (bi) bi.disabled = running;
  if (be) be.disabled = running;
  // modal เกาะ state เดียวกัน — เปิดค้างไว้ก็ไหลต่อสด · ■ หยุด โผล่เฉพาะตอนวิ่ง
  if (!$('#ttymodal').hidden) {
    const big = $('#ttybig');
    const follow = big.scrollTop + big.clientHeight >= big.scrollHeight - 30;
    big.textContent = jobState.buf.join('\n');
    if (follow) big.scrollTop = big.scrollHeight;
    $('#ttydot').classList.toggle('live', running);
    $('#ttytitle').textContent = `${jobState.name ?? 'job'} ${running ? t('job.running') : t('job.ended')}`;
    $('#ttykill').hidden = !running;
  }
}
async function openTtyModal() {
  $('#ttymodal').hidden = false;
  $('#ttystart').hidden = true;
  // ดึง log เต็มจาก server (buffer ฝั่งเราอาจโดน cap) แล้วค่อยตามสด
  if (jobState.name) {
    try {
      const d = await (await fetch(`/api/job-log?name=${jobState.name}&from=0`)).json();
      if (d.lines) { jobState.buf = d.lines; jobState.from = d.next; }
    } catch {}
  }
  renderTty();
  $('#ttybig').scrollTop = $('#ttybig').scrollHeight;
}
function closeTtyModal() { $('#ttymodal').hidden = true; }
$('#ttymodal').addEventListener('click', (e) => { if (e.target.id === 'ttymodal') closeTtyModal(); });

// snippet กลางที่ hit แรก ไม่ใช่หัวแถว — หัว tool_result ยาวๆ แทบไม่เคยมีคำที่ค้น
function snippet(text, q) {
  const t = String(text);
  if (!q) return esc(t.slice(0, 260));
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(t.slice(0, 260));
  const start = Math.max(0, i - 110);
  const cut = t.slice(start, i + q.length + 150);
  const j = i - start;
  return (start > 0 ? '…' : '') + esc(cut.slice(0, j)) +
    '<mark>' + esc(cut.slice(j, j + q.length)) + '</mark>' + esc(cut.slice(j + q.length));
}

let seqNo = 0;
async function search() {
  const my = ++seqNo;
  const q = $('#q').value.trim();
  const p = new URLSearchParams({ q, mode, ...Object.fromEntries(Object.entries(filter).filter(([, v]) => v)) });
  const d = await (await fetch('/api/search?' + p)).json();
  if (my !== seqNo) return;
  if (d.error) { $('#took').textContent = '—'; $('#results').innerHTML = `<div id="empty">${esc(d.error)}</div>`; return; }
  const tk = d.took ?? {};
  $('#took').textContent = `${d.n} rows · ` + (tk.db != null ? `${tk.db}ms db · ` : '') + `${tk.total}ms · ${d.mode}`;
  $('#results').innerHTML = d.rows.length ? d.rows.map((r) => `
    <div class="row" data-id="${esc(r.id)}" data-file="${esc(r.file)}" data-line="${r.line}">
      <div class="kind">
        <div class="t ${r.kind} ${r.role ?? ''}">${r.kind === 'tool_use' ? esc(r.tool || 'tool') : r.kind ?? '·'}</div>
        <div class="when">${fmtTs(r.ts)}</div>
      </div>
      <div>
        <div class="h">
          <span>${esc(r.repo ?? '')}</span>
          <span>${esc((r.session ?? '').slice(0, 20))}#${r.line}</span>
          <span>${r.tier ?? ''}</span>
          ${r.model ? `<span>${esc(String(r.model).replace('claude-', ''))}</span>` : ''}
          ${r.d != null ? `<span>d=${r.d.toFixed(3)}</span>` : ''}
          ${d.mode === 'hybrid' ? `<span class="prov">${r.ftsRank ? `<b>fts#${r.ftsRank}</b>` : ''} ${r.vecRank ? `<b>vec#${r.vecRank}</b>` : ''}</span>` : ''}
        </div>
        <div class="t2">${snippet(r.text, d.mode !== 'vector' ? q : '')}</div>
      </div>
    </div>`).join('') : `<div id="empty">${esc(t('search.noHits'))}</div>`;
  document.querySelectorAll('.row').forEach((el) =>
    el.addEventListener('click', () => openDrill({ id: el.dataset.id, file: el.dataset.file, line: Number(el.dataset.line) })));
}

// ── drill: text / timeline / raw (raw อ่านบรรทัดต้นฉบับจากดิสก์ ไม่ได้เก็บซ้ำใน index) ──
function closeDrill() { $('#drill').hidden = true; cur = null; }
document.querySelectorAll('#drill .tabs button').forEach((b) => b.onclick = () => {
  curTab = b.dataset.t;
  document.querySelectorAll('#drill .tabs button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  renderDrill();
});
async function openDrill(target) {
  cur = target;
  $('#drill').hidden = false;
  $('#d-meta').textContent = `${cur.file} : ${cur.line}`;
  renderDrill();
}
async function renderDrill() {
  if (!cur) return;
  const bd = $('#d-body');
  bd.textContent = '…';
  try {
    if (curTab === 'text') {
      const ev = await (await fetch(`/api/event?id=${encodeURIComponent(cur.id)}`)).json();
      const q = $('#q').value.trim();
      bd.innerHTML = `<div class="h" style="color:var(--dim);font-size:11px;margin-bottom:8px">
        ${ev.kind}${ev.tool ? ` · ${esc(ev.tool)}` : ''} · ${ev.role} · ${fmtTs(ev.ts)} · ${(ev.n_chars ?? 0).toLocaleString()} chars${ev.n_chars > 4000 ? esc(t('drill.capped')) : ''}</div>` +
        (q ? snippetFull(ev.text, q) : esc(ev.text ?? '—'));
    } else if (curTab === 'timeline') {
      const d = await (await fetch(`/api/session?file=${encodeURIComponent(cur.file)}&center=${cur.line}`)).json();
      bd.innerHTML = `<div class="h" style="color:var(--dim);font-size:11px">${esc(t('drill.jumpHint', { total: d.total }))}</div>` +
        d.rows.map((r) => `<div class="ev ${r.line === cur.line ? 'cur' : ''}" data-line="${r.line}" data-idx="${r.idx}">
          <div class="h">#${r.line}.${r.idx} · <span class="t ${r.kind} ${r.role}">${r.kind === 'tool_use' ? esc(r.tool || 'tool') : r.kind}</span> · ${fmtTs(r.ts)}</div>
          <div class="t">${esc(String(r.text).slice(0, 260))}</div></div>`).join('');
      bd.querySelectorAll('.ev').forEach((el) => el.onclick = () => {
        cur = { id: `${cur.file}#${el.dataset.line}#${el.dataset.idx}`, file: cur.file, line: Number(el.dataset.line) };
        $('#d-meta').textContent = `${cur.file} : ${cur.line}`;
        curTab = 'text';
        document.querySelectorAll('#drill .tabs button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.t === 'text'));
        renderDrill();
      });
      bd.querySelector('.cur')?.scrollIntoView({ block: 'center' });
    } else {
      const res = await fetch(`/api/raw?file=${encodeURIComponent(cur.file)}&line=${cur.line}`);
      const raw = await res.text();
      try { bd.textContent = JSON.stringify(JSON.parse(raw), null, 2); }
      catch { bd.textContent = raw; }
    }
  } catch (e) { bd.textContent = t('common.loadFailed', { error: e }); }
}
function snippetFull(text, q) {
  const t = String(text ?? '');
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
}

// popup แผนที่ใน iframe — ไม่พาออกจากหน้าค้น (ปุ่ม ↗ ถ้าอยากเต็มจอ)
function openMapModal(repo) {
  const url = `/map?repo=${encodeURIComponent(repo)}`;
  $('#mapframe').src = url;
  $('#mapmodalOpen').href = url;
  $('#mapmodal').hidden = false;
  return false; // กัน navigate ของ <a>
}
function closeMapModal() {
  $('#mapmodal').hidden = true;
  $('#mapframe').src = 'about:blank'; // หยุด render loop ของแผนที่ตอนปิด
}
$('#mapmodal').addEventListener('click', (e) => { if (e.target.id === 'mapmodal') closeMapModal(); });

async function refreshIndex() {
  $('#took').textContent = t('search.refreshing');
  await fetch('/api/refresh');
  loadFacets(); search();
}

let deb;
$('#q').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(search, 250); });
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(deb); search(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') closeDrill();
});
i18n.apply();
loadFacets(); search();
</script>

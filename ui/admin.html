<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/i18n.js"></script>
<title>Jobs · Lance Indexer</title>
<style>
  :root {
    --bg: #0c0d10; --panel: #131519; --panel2: #181b21; --line: #23272f; --line2: #2e333d;
    --fg: #e4e7ec; --dim: #8b93a1; --dim2: #5d6572;
    --acc: #7dd3a0; --accdim: #2f5c45; --warn: #f0c674; --err: #f0928f;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; scrollbar-color: var(--line2) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 9px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 5px; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--mono);
         display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font-weight: 600; color: var(--acc); }
  .brand span { color: var(--dim2); font-weight: 400; }
  nav.pages { display: flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
  nav.pages a { color: var(--dim); font: 11px var(--mono); padding: 8px 12px;
                text-decoration: none; white-space: nowrap; }
  nav.pages a + a { border-left: 1px solid var(--line2); }
  nav.pages a:hover { color: var(--fg); }
  nav.pages a[aria-current="page"] { background: var(--accdim); color: #dff5e8; }
  .stats { margin-left: auto; display: flex; gap: 18px; color: var(--dim); font-size: 12px; }
  .stats b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }

  .launch { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
            border-bottom: 1px solid var(--line); background: var(--panel); }
  .launch button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px;
                   color: var(--fg); font: 12px var(--mono); padding: 7px 14px; cursor: pointer; }
  .launch button:hover { border-color: var(--accdim); color: var(--acc); }
  .launch input { width: 90px; background: var(--bg); border: 1px solid var(--line2);
                  border-radius: 6px; color: var(--fg); font: 12px var(--mono); padding: 7px 9px; }
  .launch .hint { color: var(--dim2); font-size: 11px; }

  .body { display: grid; grid-template-columns: minmax(380px, 46%) 1fr; min-height: 0; }
  #joblist { overflow-y: auto; border-right: 1px solid var(--line); }
  .job { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center;
         padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .job:hover { background: var(--panel); }
  .job[aria-selected="true"] { background: #7dd3a010; box-shadow: inset 3px 0 var(--acc); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim2); margin: 0 auto; }
  .dot.live { background: var(--acc); animation: blink 1.2s infinite; }
  .dot.ok { background: var(--accdim); }
  .dot.bad { background: var(--err); }
  @keyframes blink { 50% { opacity: .3; } }
  .job .nm { font-weight: 600; }
  .job .nm small { color: var(--dim2); font-weight: 400; margin-left: 6px; }
  .job .sub { color: var(--dim2); font-size: 11px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; max-width: 42ch; }
  .job .tm { color: var(--dim); font-size: 11px; text-align: right; }
  #nojobs { color: var(--dim2); text-align: center; padding: 60px 20px; }

  #term { display: flex; flex-direction: column; min-height: 0; background: #08090c; }
  #term .thead { display: flex; align-items: center; gap: 10px; padding: 9px 14px;
                 border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  #termout { flex: 1; margin: 0; padding: 12px 14px; overflow-y: auto;
             font: 12.5px/1.55 var(--mono); color: #9fb8a8;
             white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<header>
  <span class="brand">⛏ lance<span>·indexer</span></span>
  <nav class="pages">
    <a href="/" data-i18n="nav.search"></a>
    <a href="/map" data-i18n="nav.map"></a>
    <a href="/insight" data-i18n="nav.insight"></a>
    <a href="/live" data-i18n="nav.live"></a>
    <a href="/admin" aria-current="page" data-i18n="nav.jobs"></a>
  </nav>
  <div class="stats">
    <span>rows <b id="sRows">—</b></span>
    <span>files <b id="sFiles">—</b></span>
    <span>vectors <b id="sVec">—</b> / <b id="sCand">—</b> text</span>
    <button class="ghost" data-lang-switch style="background:transparent;border:1px solid var(--line2);border-radius:6px;color:var(--dim);font:11px var(--mono);padding:6px 12px;cursor:pointer"></button>
  </div>
</header>
<div class="launch">
  <button onclick="start('import')">⟳ import</button>
  <button onclick="start('embed')">⚡ embed</button>
  <input id="embedN" type="number" value="2000" min="1" step="500">
  <label style="color:var(--dim);font-size:12px;display:flex;align-items:center;gap:5px">
    <input id="embedGpus" type="checkbox" checked> +gpu1/gpu2 (ssh tunnel)
  </label>
  <span class="hint" data-i18n="admin.perRound"></span>
</div>
<div class="body">
  <div id="joblist"><div id="nojobs" data-i18n="admin.noJobs"></div></div>
  <div id="term">
    <div class="thead"><span class="dot" id="tdot"></span><span id="ttitle" data-i18n="admin.pickJob"></span>
      <button id="tkill" hidden onclick="killSelected()"
        style="margin-left:auto;background:#3a1f1f;border:1px solid #f0928f;border-radius:6px;color:#f0c0be;font:12px var(--mono);padding:6px 14px;cursor:pointer" data-i18n="job.stop"></button>
    </div>
    <pre id="termout"></pre>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let selected = null;      // job id ที่เปิด log อยู่
let from = 0;
const fmtT = (ms) => new Date(ms).toTimeString().slice(0, 8);
const fmtEl = (s) => s >= 60 ? `${Math.floor(s / 60)}m${s % 60}s` : `${s}s`;

async function refreshJobs() {
  const d = await (await fetch('/api/jobs')).json();
  $('#sRows').textContent = d.rows.toLocaleString();
  $('#sFiles').textContent = d.files.toLocaleString();
  $('#sVec').textContent = d.vectors.toLocaleString();
  $('#sCand').textContent = d.textCandidates.toLocaleString();
  const list = $('#joblist');
  if (!d.jobs.length) return;
  list.innerHTML = d.jobs.map((j) => `
    <div class="job" data-id="${j.id}" aria-selected="${j.id === selected}">
      <span class="dot ${j.running ? 'live' : j.code === 0 ? 'ok' : 'bad'}"></span>
      <div>
        <div class="nm">#${j.id} ${j.name}<small>${j.args ?? ''}</small></div>
        <div class="sub">${j.last.replace(/</g, '&lt;')}</div>
      </div>
      <div class="tm">${fmtT(j.started)}<br>${j.running ? t('job.running').replace('· ', '') : `exit ${j.code}`} · ${fmtEl(j.elapsed_s)}</div>
    </div>`).join('');
  list.querySelectorAll('.job').forEach((el) => el.onclick = () => select(Number(el.dataset.id)));
  // งานที่กำลังวิ่ง ถ้ายังไม่ได้เลือกอะไร → เกาะดูอัตโนมัติ
  const live = d.jobs.find((j) => j.running);
  if (live && selected === null) select(live.id);
}

function select(id) {
  selected = id; from = 0;
  $('#termout').textContent = '';
  document.querySelectorAll('.job').forEach((el) => el.setAttribute('aria-selected', Number(el.dataset.id) === id));
  poll();
}

let pollTimer = null;
async function poll() {
  clearTimeout(pollTimer);
  if (selected === null) return;
  try {
    const d = await (await fetch(`/api/job-log?id=${selected}&from=${from}`)).json();
    if (d.error) { $('#ttitle').textContent = tsrv(d); return; }
    $('#ttitle').textContent = `#${d.id} ${d.name} ${d.running ? t('job.running') : `· exit ${d.code}`}`;
    $('#tdot').className = `dot ${d.running ? 'live' : d.code === 0 ? 'ok' : 'bad'}`;
    $('#tkill').hidden = !d.running;
    if (d.lines.length) {
      const out = $('#termout');
      const follow = out.scrollTop + out.clientHeight >= out.scrollHeight - 30;
      out.textContent += (out.textContent ? '\n' : '') + d.lines.map(srvLine).join('\n');
      from = d.next;
      if (follow) out.scrollTop = out.scrollHeight;
    }
    if (d.running) pollTimer = setTimeout(poll, 1000);
  } catch { pollTimer = setTimeout(poll, 2000); }
}

async function killSelected() {
  if (selected === null) return;
  await fetch(`/api/job-kill?id=${selected}`, { method: 'POST' });
  refreshJobs();
}
async function start(name) {
  const n = $('#embedN').value || 2000;
  const gpus = $('#embedGpus').checked ? '&gpus=1' : '';
  const d = await (await fetch(`/api/${name}${name === 'embed' ? `?n=${n}${gpus}` : ''}`, { method: 'POST' })).json();
  await refreshJobs();
  if (d.id) select(d.id);
  else if (!d.started) { // วิ่งอยู่แล้ว — เกาะตัวที่วิ่ง
    const dj = await (await fetch('/api/jobs')).json();
    const live = dj.jobs.find((j) => j.name === name && j.running);
    if (live) select(live.id);
  }
}

i18n.apply();
refreshJobs();
setInterval(refreshJobs, 2500);
</script>
<script src="/demo.js"></script>
</body>
</html>

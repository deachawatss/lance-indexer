<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนความจำ · lance-indexer</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b23; --line: #2a3342;
    --fg: #d7dde6; --dim: #7d8794; --acc: #e8b04b; --acc2: #5ba8f5;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
         font: 14px/1.5 "SF Mono", ui-monospace, Menlo, monospace; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 14px 20px 10px;
           background: linear-gradient(#0a0c10ee, #0a0c1000); pointer-events: none; }
  header > * { pointer-events: auto; }
  header .crumb { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
                  display: flex; align-items: center; gap: 12px; }
  nav.pages { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
              text-transform: none; letter-spacing: 0; }
  nav.pages a { color: var(--dim); font: 11px inherit; padding: 6px 11px; text-decoration: none; }
  nav.pages a + a { border-left: 1px solid var(--line); }
  nav.pages a:hover { color: var(--fg); }
  nav.pages a[aria-current="page"] { background: #2f5c45; color: #dff5e8; }
  header h1 { font-size: 20px; margin: 4px 0 4px; }
  header p { color: var(--dim); margin: 0 0 10px; font-size: 13px; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
          color: var(--dim); font: 12px inherit; padding: 6px 12px; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }
  /* แผงซ้ายแนวตั้ง — แบบชิปโหมดของสมองไซ */
  #leftbar { position: fixed; left: 14px; top: 128px; z-index: 8;
             display: flex; flex-direction: column; gap: 5px; width: 128px; }
  #leftbar .sep { height: 1px; background: var(--line); margin: 4px 2px; }
  #leftbar .chip { text-align: left; background: #0f131af0; }
  #viztabs { display: flex; flex-direction: column; gap: 5px; }
  #viztabs button { background: #0f131af0; border: 1px solid var(--line); border-radius: 6px;
                    color: var(--dim); font: 12px inherit; padding: 7px 11px; cursor: pointer;
                    text-align: left; }
  #viztabs button:hover { color: var(--fg); border-color: var(--line); }
  #viztabs button[aria-pressed="true"] { background: #2a4a6b55; color: var(--acc2);
                                         border-color: #3a5a8b; }
  .meta { color: var(--dim); font-size: 12px; margin-left: 6px; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #0a0c10; }
  #vizroot { position: absolute; inset: 0; }
  #vizroot canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .label { position: absolute; left: 0; top: 0; pointer-events: none;
           font-size: 10.5px; color: var(--dim); background: #0a0c10b8;
           padding: 0 4px; border-radius: 3px; max-width: 15rem;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
           transition: opacity .15s; }
  #hover { position: absolute; left: 0; top: 0; pointer-events: none; max-width: 24rem; z-index: 3;
           background: #10141bf5; border: 1px solid var(--line); border-radius: 8px;
           padding: 8px 12px; font-size: 12.5px; opacity: 0; transition: opacity .12s; }
  #hover .m { color: var(--dim); font-size: 11px; margin-top: 3px; }
  #hover .pv { margin-top: 5px; font-size: 11.5px; color: var(--dim); white-space: pre-wrap;
               word-break: break-word; max-height: 10em; overflow: hidden;
               border-left: 2px solid var(--line); padding-left: 8px; }
  #detail { position: fixed; right: 14px; top: 110px; bottom: 14px; z-index: 9;
            width: min(460px, 88vw); overflow-y: auto;
            border: 1px solid var(--acc); border-radius: 10px;
            background: #131519f2; box-shadow: 0 14px 44px #000a; }
  #detail[hidden] { display: none; }
  #detail .hd { display: flex; justify-content: space-between; gap: 10px;
                border-bottom: 1px solid var(--line); padding: 10px 16px; }
  #detail .hd .m { color: var(--dim); font-size: 12px; }
  #detail .bd { padding: 12px 16px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  #detail button { background: none; border: none; color: var(--dim); cursor: pointer; font: inherit; }
  #detail h3 { font-size: 10px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase;
               margin: 4px 16px 4px; }
  #detail .nb { padding: 7px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  #detail .nb:hover { background: #e8b04b14; }
  #detail .nb .t { font-size: 12.5px; color: #c9d0da; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; }
  #detail .nb:hover .t { white-space: normal; }              /* hover = กางชื่อเต็ม */
  #detail .nb .pv { display: none; margin-top: 4px; font-size: 12px; color: var(--dim);
                    white-space: pre-wrap; word-break: break-word; max-height: 9em; overflow: hidden;
                    border-left: 2px solid var(--line2); padding-left: 8px; }
  #detail .nb:hover .pv { display: block; }                  /* hover = อ่านเนื้อจริงได้เลย */
  #detail .nb .m { color: var(--dim); font-size: 11px; display: flex; gap: 10px; }
  #detail .nb .m b { color: var(--acc2); font-weight: 500; }
  #err { color: var(--dim); position: fixed; inset: 0; display: grid; place-items: center; }
  #err[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="vizroot"></div><div id="hover"></div></div>
<header>
  <div class="crumb"><span>⛏ lance-indexer</span>
    <nav class="pages">
      <a href="/">🔍 ค้นหา</a>
      <a href="/map" aria-current="page">🗺 แผนที่</a>
      <a href="/insight">💡 insight</a>
      <a href="/live">📡 live</a>
      <a href="/admin">⚙ jobs</a>
    </nav>
  </div>
  <h1>แผนความจำ<span id="repochip" class="meta"></span>
    <span class="meta" id="stats" style="font-weight:400">โหลด…</span></h1>
  <p>ตำแหน่งมาจาก embedding — อยู่ใกล้กันคือความหมายใกล้กัน ลากเพื่อหมุน เลื่อนเพื่อซูม กดเพื่อเปิด</p>
</header>
<!-- แผงแนวตั้งซ้าย แบบสมองไซ: visualizer + โหมด -->
<div id="leftbar">
  <span id="viztabs" title="เลือก visualizer plugin"></span>
  <div class="sep"></div>
  <button class="chip" id="mMap" aria-pressed="true">แผน</button>
  <button class="chip" id="mWeb" aria-pressed="false">ใย</button>
  <button class="chip" id="mNames" aria-pressed="true">ชื่อ 20</button>
  <button class="chip" id="mSpin" title="หมุนหยุดเองเมื่อลาก — กดนี่เพื่อหมุนต่อ"
          onclick="active?.setSpin?.(true)">🔄 หมุนต่อ</button>
</div>
<div id="detail" hidden></div>
<div id="err" hidden></div>

<script>
// ── host: โหลดข้อมูล + คุม state + detail — ตัววาดเป็น plugin ใน /viz/*.js สลับได้ ──
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plugins = {};
window.registerViz = (p) => { plugins[p.id] = p; };

const host = {
  stage: $('#stage'), root: $('#vizroot'), hoverEl: $('#hover'),
  G: null, adj: new Map(), selIdx: -1,
  state: { mode: 'map', names: true },
  reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
  esc,
  // hover กลาง: meta + เนื้อจริง (lazy fetch ครั้งเดียวต่อ node) — ทุก plugin ใช้ตัวเดียวกัน
  hoverNode(i, x, y) {
    const hv = host.hoverEl;
    if (i < 0) { hv.style.opacity = '0'; hv._i = -1; return; }
    const nd = host.G.nodes[i];
    hv.style.transform = `translate(${Math.min(Math.max(x + 14, 8), host.stage.clientWidth - 400)}px,${Math.min(Math.max(y - 10, 8), host.stage.clientHeight - 210)}px)`;
    hv.style.opacity = '1';
    if (hv._i === i) return;               // node เดิม — ไม่ re-render/fetch ซ้ำ
    hv._i = i;
    hv.innerHTML = `<div>${esc(nd.title)}</div>
      <div class="m">📦 ${esc(nd.repo ?? '?')} · ${esc(nd.session.slice(0, 24))}#${nd.line} · ${nd.degree} เพื่อนบ้าน · ${esc(nd.ts ? new Date(nd.ts).toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok' }).slice(0, 16) : '')}</div>
      <div class="pv">${nd._pv ? esc(String(nd._pv).slice(0, 420)) : '…'}</div>`;
    if (!nd._pv) {
      fetch(`/api/event?id=${encodeURIComponent(nd.id)}`).then((r) => r.json()).then((ev) => {
        nd._pv = ev.text ?? ev.error ?? '—';
        if (hv._i === i) { const p = hv.querySelector('.pv'); if (p) p.textContent = String(nd._pv).slice(0, 420); }
      }).catch(() => {});
    }
  },
  // plugin เรียกตอน click node — host จัดการ toggle + detail แล้วสะท้อนกลับ
  select(i) {
    host.selIdx = (i < 0 || i === host.selIdx) ? -1 : i;
    if (host.selIdx < 0) $('#detail').hidden = true; else openDetail(host.G.nodes[host.selIdx]);
    active?.setSelected?.(host.selIdx);
  },
};

let active = null, namesTouched = false;
const REPO = new URLSearchParams(location.search).get('repo') ?? '';

async function openDetail(nd) {
  const box = $('#detail');
  box.hidden = false;
  const selIdx = host.selIdx;
  // ทุกก้อนที่มีเส้นเชื่อมกับ node นี้ เรียงใกล้สุดก่อน — hover เพื่อชี้ว่าอันไหนบนแผนที่
  const nbs = host.G.edges
    .filter((e) => e.s === selIdx || e.t === selIdx)
    .map((e) => ({ i: e.s === selIdx ? e.t : e.s, d: e.d, kind: e.kind }))
    .sort((a, b) => a.d - b.d);
  box.innerHTML = `<div class="hd"><div><div>${esc(nd.title)}</div>
    <div class="m">${esc(nd.session)}#${nd.line} · ${nbs.length} เส้นเชื่อม</div></div>
    <button onclick="host.select(-1)">✕</button></div><div class="bd">กำลังโหลด…</div>
    <h3>ก้อนที่มีเส้นเชื่อม — hover เพื่อชี้บนแผนที่</h3>
    ${nbs.map((nb) => {
      const n = host.G.nodes[nb.i];
      return `<div class="nb" data-i="${nb.i}">
        <div class="t">${esc(n.title)}</div>
        <div class="m"><b>d=${nb.d.toFixed(3)}</b><span>${nb.kind}</span>
          <span>${esc(n.session.slice(0, 22))}#${n.line}</span></div>
        <div class="pv">…</div></div>`;
    }).join('')}`;
  box.querySelectorAll('.nb').forEach((el) => {
    const i = Number(el.dataset.i);
    el.onmouseenter = () => {
      active?.setHighlight?.(i);
      // ดึงเนื้อจริงครั้งแรกที่ hover — อ่านได้เลยไม่ต้องคลิก
      const n = host.G.nodes[i];
      if (!n._pv) {
        n._pv = 'กำลังโหลด…';
        fetch(`/api/event?id=${encodeURIComponent(n.id)}`).then((r) => r.json())
          .then((ev) => { n._pv = ev.text ?? ev.error ?? '—'; const p = el.querySelector('.pv'); if (p) p.textContent = String(n._pv).slice(0, 600); })
          .catch(() => { n._pv = 'โหลดไม่ได้'; });
      }
      el.querySelector('.pv').textContent = String(n._pv).slice(0, 600);
    };
    el.onmouseleave = () => active?.setHighlight?.(-1);
    el.onclick = () => { active?.setHighlight?.(-1); host.select(i); };
  });
  try {
    const ev = await (await fetch(`/api/event?id=${encodeURIComponent(nd.id)}`)).json();
    if (ev.error) { box.querySelector('.bd').textContent = ev.error; return; }
    box.querySelector('.bd').innerHTML =
      `<div class="m" style="color:var(--dim);font-size:11px;margin-bottom:8px">
        ${esc(ev.kind)}${ev.tool ? ' · ' + esc(ev.tool) : ''} · ${esc(ev.role)} · ${esc(ev.repo)}
        · ${esc(ev.ts ? new Date(ev.ts).toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok' }).slice(0, 16) : '')} · ${(ev.n_chars ?? 0).toLocaleString()} chars</div>` +
      esc(ev.text ?? '—').replace(/\n/g, '<br>');
  } catch (e) { box.querySelector('.bd').textContent = 'โหลดไม่ได้: ' + e; }
}

function setMode(m) {
  host.state.mode = m;
  $('#mMap').setAttribute('aria-pressed', m === 'map');
  $('#mWeb').setAttribute('aria-pressed', m === 'web');
  if (!namesTouched) host.state.names = (m === 'map');
  $('#mNames').setAttribute('aria-pressed', host.state.names);
  active?.setState?.(host.state);
}
$('#mMap').onclick = () => setMode('map');
$('#mWeb').onclick = () => setMode('web');
$('#mNames').onclick = () => {
  namesTouched = true; host.state.names = !host.state.names;
  $('#mNames').setAttribute('aria-pressed', host.state.names);
  active?.setState?.(host.state);
};

function switchViz(id) {
  if (active) { try { active.destroy(); } catch {} }
  host.root.innerHTML = '';
  host.hoverEl.style.opacity = '0';
  active = plugins[id];
  try { localStorage.setItem('viz', id); } catch {}
  if (active && host.G) { active.init(host); active.setSelected?.(host.selIdx); active.setState?.(host.state); }
}

async function boot() {
  // โหลด plugin ทุกไฟล์ใน /viz — เพิ่มตัวใหม่ = วางไฟล์ .js ไม่ต้องแก้หน้า
  const files = await (await fetch('/viz/index.json')).json();
  await Promise.all(files.map((f) => new Promise((ok) => {
    const s = document.createElement('script');
    s.src = `/viz/${f}`; s.onload = ok; s.onerror = ok;
    document.head.appendChild(s);
  })));
  // viz เป็น tab — เพิ่ม plugin ใหม่ = tab โผล่เอง
  const tabs = $('#viztabs');
  tabs.innerHTML = Object.values(plugins).map((p) =>
    `<button data-v="${p.id}">${esc(p.name)}</button>`).join('');
  let want = 'atlas'; try { want = localStorage.getItem('viz') ?? 'atlas'; } catch {}
  if (!plugins[want]) want = Object.keys(plugins)[0];
  const markTabs = (id) => tabs.querySelectorAll('button').forEach((b) =>
    b.setAttribute('aria-pressed', b.dataset.v === id));
  tabs.querySelectorAll('button').forEach((b) => b.onclick = () => { markTabs(b.dataset.v); switchViz(b.dataset.v); });
  markTabs(want);

  const res = await fetch('/api/map' + (REPO ? `?repo=${encodeURIComponent(REPO)}` : ''));
  const d = await res.json();
  if (d.error) { $('#err').hidden = false; $('#err').textContent = d.error; $('#stats').textContent = '—'; return; }
  host.G = d;
  if (REPO) $('#repochip').textContent = ` · 📦 ${REPO}`;
  host.adj = new Map();
  for (const e of d.edges) {
    if (!host.adj.has(e.s)) host.adj.set(e.s, new Set());
    if (!host.adj.has(e.t)) host.adj.set(e.t, new Set());
    host.adj.get(e.s).add(e.t); host.adj.get(e.t).add(e.s);
  }
  const simN = d.edges.filter(e => e.kind === 'similar').length;
  const brN = d.edges.filter(e => e.kind === 'bridge').length;
  $('#stats').textContent =
    `${d.sampled}${d.totalVectors > d.sampled ? `/${d.totalVectors}` : ''} จุด${REPO ? ` (เฉพาะ ${REPO})` : ' (ทั้งเครื่อง)'} · k=${d.k}` +
    ` · อธิบายได้ ${Math.round(d.explained*100)}%` +
    ` · ${simN} similar + ${brN} bridge` +
    (d.unembedded > 0 ? ` · ${d.unembedded.toLocaleString()} ยังไม่มีเวกเตอร์` : '');
  switchViz(want);
}
boot();
</script>
<script src="/demo.js"></script>
</body>
</html>
